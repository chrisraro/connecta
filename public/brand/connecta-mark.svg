<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Connecta">
  <title>Connecta</title>
  <!--
    The mark: a surveyed lot. An eight-corner boundary with 45-degree
    chamfers, its right side left open, drawn in currentColor so it inherits
    from context when inlined. The red dot in the gap is the point of
    beginning; it is always red. Source of truth for
    components/brand/ConnectaMark.tsx.
  -->
  <path d="M50 23 L37 10 H19 L6 23 V41 L19 54 H37 L50 41" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="miter"/>
  <circle cx="57" cy="32" r="4.5" fill="#D0312D"/>
</svg>
